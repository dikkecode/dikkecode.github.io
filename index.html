<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dikkecode — Elke keer weer anders</title>
    <meta name="description" content="Elke refresh een nieuw stukje code. Sommige nuttig. De meeste niet. Herkenbare programmeerhumor in het Nederlands.">
    <meta name="theme-color" content="#0f0f1a">

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="dikkecode — Elke keer weer anders">
    <meta property="og:description" content="Elke refresh een nieuw stukje code. Sommige nuttig. De meeste niet.">
    <meta property="og:url" content="https://dikkecode.github.io">
    <meta property="og:image" content="https://dikkecode.github.io/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Fonts (preconnect for performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;600;800&display=swap">

    <!-- Prism.js syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --accent: #e94560;
            --accent2: #0f3460;
            --text: #eaeaea;
            --muted: #888;
            --code-bg: #1d1f21;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 1rem;
            position: relative;
        }

        .logo {
            font-family: 'Fira Code', monospace;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent), #ff6b6b, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
        }

        .logo::after {
            content: '_';
            animation: blink 1s step-end infinite;
            -webkit-text-fill-color: var(--accent);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .subtitle {
            color: var(--muted);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .emoji-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .emoji-drop {
            position: absolute;
            top: -50px;
            font-size: 1.5rem;
            animation: fall linear forwards;
            opacity: 0.15;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        main {
            max-width: 750px;
            width: 100%;
            padding: 1rem;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .code-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.1);
            margin-top: 1.5rem;
            border: 1px solid rgba(233, 69, 96, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .code-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(233, 69, 96, 0.2);
        }

        .card-header {
            background: var(--accent2);
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; border: none; padding: 0; }
        .dot-red { background: #ff5f56; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .dot-red:hover { transform: scale(1.3); box-shadow: 0 0 8px rgba(255, 95, 86, 0.6); }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .card-header .filename {
            margin-left: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .code-body {
            padding: 1.5rem;
            background: var(--code-bg);
        }

        .code-body pre {
            margin: 0;
            border-radius: 0;
            background: transparent !important;
            padding: 0 !important;
        }

        .code-body pre code {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            white-space: pre;
            tab-size: 2;
            background: transparent !important;
        }

        .explanation {
            padding: 1.2rem 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ccc;
        }

        .explanation strong {
            color: var(--accent);
        }

        /* Closed message */
        .closed-message {
            display: none;
            text-align: center;
            padding: 3rem 2rem;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid rgba(233, 69, 96, 0.15);
            margin-top: 1.5rem;
            animation: fadeIn 0.5s ease forwards;
        }

        .closed-message .beer {
            font-size: 5rem;
            display: block;
            margin-bottom: 1rem;
            animation: beerWobble 1s ease-in-out infinite alternate;
        }

        @keyframes beerWobble {
            from { transform: rotate(-5deg); }
            to { transform: rotate(5deg); }
        }

        .closed-message h2 {
            font-family: 'Fira Code', monospace;
            font-size: 2rem;
            background: linear-gradient(135deg, #ffa502, #ffbd2e, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .closed-message p {
            color: var(--muted);
            font-size: 1rem;
        }

        .closed-message .reopen-link {
            display: inline-block;
            margin-top: 1.2rem;
            color: var(--accent);
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: opacity 0.2s;
        }

        .closed-message .reopen-link:hover {
            opacity: 0.7;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #ff6b6b);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            background: var(--accent2);
        }

        .counter {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--muted);
            font-size: 0.85rem;
            font-family: 'Fira Code', monospace;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--accent2);
            color: var(--text);
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            padding: 0.7rem 1.4rem;
            border-radius: 50px;
            border: 1px solid rgba(233, 69, 96, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 100;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--muted);
            font-size: 0.8rem;
            position: relative;
            z-index: 1;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .logo { font-size: 2rem; }
            .code-body pre code { font-size: 0.75rem; }
            .btn { padding: 0.6rem 1.2rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="emoji-rain" id="emojiRain" aria-hidden="true"></div>

<header>
    <h1 class="logo">dikkecode</h1>
    <p class="subtitle">Elke refresh een nieuw stukje code. Sommige nuttig. De meeste niet.</p>
</header>

<main>
    <div class="code-card fade-in" id="codeCard">
        <div class="card-header">
            <button class="dot dot-red" onclick="sluitWindow()" aria-label="Sluit codeblok" title="Sluiten"></button>
            <div class="dot dot-yellow" aria-hidden="true"></div>
            <div class="dot dot-green" aria-hidden="true"></div>
            <span class="filename" id="filename">laden...</span>
        </div>
        <div class="code-body">
            <pre id="codeBlock"><code id="codeContent">Laden...</code></pre>
        </div>
        <div class="explanation" id="explanation"></div>
    </div>

    <div class="closed-message" id="closedMessage">
        <span class="beer" aria-hidden="true">&#x1F37A;</span>
        <h2>Tijd voor bier!</h2>
        <p>De code is gesloten. Je hebt genoeg gedaan voor vandaag.</p>
        <span class="reopen-link" onclick="heropenen()" role="button" tabindex="0">&#x1F4BB; toch nog even coden...</span>
    </div>

    <div class="btn-row" id="btnRow">
        <button class="btn btn-primary" onclick="nieuwSnippet()">&#x1F504; Volgende code</button>
        <button class="btn btn-secondary" onclick="kopieerCode()">&#x1F4CB; Kopieer</button>
    </div>

    <div class="counter" id="counter"></div>
</main>

<div class="toast" id="toast"></div>

<footer>
    Gebouwd met &#x2764;&#xFE0F; en twijfelachtige programmeervaardigheden &mdash;
    <a href="https://github.com/dikkecode" target="_blank" rel="noopener">GitHub</a>
</footer>

<!-- Prism.js core + languages -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ruby.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-kotlin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>

<!-- Snippets data -->
<script src="snippets.js"></script>

<script>
let huidigeIndex = -1;
let gezien = 0;
let emojiInterval = null;

// --- Shuffle ---
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

let volgorde = shuffleArray([...Array(snippets.length).keys()]);

// --- Prism language map (filename ext -> prism class) ---
const langMap = {
    python: 'python', javascript: 'javascript', typescript: 'typescript',
    sql: 'sql', bash: 'bash', css: 'css', java: 'java', ruby: 'ruby',
    go: 'go', yaml: 'yaml', rust: 'rust', kotlin: 'kotlin', jsx: 'jsx',
    c: 'c'
};

// --- Toast ---
function showToast(message, duration = 2000) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), duration);
}

// --- Nieuw snippet ---
function nieuwSnippet() {
    huidigeIndex = (huidigeIndex + 1) % snippets.length;

    if (huidigeIndex === 0 && gezien > 0) {
        volgorde = shuffleArray([...Array(snippets.length).keys()]);
        showToast('\u{1F504} Nieuwe ronde! Alles opnieuw geschud.');
    }

    const s = snippets[volgorde[huidigeIndex]];

    // Animate card with rAF instead of void reflow hack
    const card = document.getElementById('codeCard');
    card.classList.remove('fade-in');
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            card.classList.add('fade-in');
        });
    });

    document.getElementById('filename').textContent = s.filename;

    // Prism highlighting
    const codeEl = document.getElementById('codeContent');
    const prismLang = langMap[s.lang] || 'plain';
    codeEl.className = `language-${prismLang}`;
    codeEl.textContent = s.code;
    Prism.highlightElement(codeEl);

    document.getElementById('explanation').innerHTML = s.uitleg;

    gezien++;
    const teGaan = snippets.length - (huidigeIndex + 1);
    document.getElementById('counter').textContent =
        `${gezien} snippet${gezien === 1 ? '' : 's'} bekeken \u{2014} ${teGaan} te gaan in deze ronde`;
}

// --- Sluit window ---
function sluitWindow() {
    const card = document.getElementById('codeCard');
    const msg = document.getElementById('closedMessage');
    const btnRow = document.getElementById('btnRow');
    const counter = document.getElementById('counter');

    card.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
    card.style.transform = 'scale(0.95)';
    card.style.opacity = '0';

    setTimeout(() => {
        card.style.display = 'none';
        btnRow.style.display = 'none';
        counter.style.display = 'none';
        msg.style.display = 'block';
    }, 400);
}

// --- Heropenen ---
function heropenen() {
    const card = document.getElementById('codeCard');
    const msg = document.getElementById('closedMessage');
    const btnRow = document.getElementById('btnRow');
    const counter = document.getElementById('counter');

    msg.style.display = 'none';
    card.style.display = '';
    card.style.transform = '';
    card.style.opacity = '';
    btnRow.style.display = '';
    counter.style.display = '';

    card.classList.remove('fade-in');
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            card.classList.add('fade-in');
        });
    });

    showToast('\u{1F4BB} Toch weer aan het werk...');
}

// --- Kopieer met fallback ---
function kopieerCode() {
    const code = document.getElementById('codeContent').textContent;
    const btn = document.querySelector('.btn-secondary');
    const orig = btn.innerHTML;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => {
            btn.innerHTML = '\u{2705} Gekopieerd!';
            setTimeout(() => btn.innerHTML = orig, 1500);
        }).catch(() => {
            fallbackCopy(code, btn, orig);
        });
    } else {
        fallbackCopy(code, btn, orig);
    }
}

function fallbackCopy(text, btn, orig) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand('copy');
        btn.innerHTML = '\u{2705} Gekopieerd!';
    } catch {
        btn.innerHTML = '\u{274C} Kopiëren mislukt';
    }
    document.body.removeChild(ta);
    setTimeout(() => btn.innerHTML = orig, 1500);
}

// --- Emoji rain with visibility pause ---
function startEmojiRain() {
    const emojis = ['\u{1F4BB}', '\u{1F41B}', '\u{2615}', '\u{1F525}', '\u{1F605}', '\u{1F680}', '\u{2328}\u{FE0F}', '\u{1F389}', '\u{1F4BE}', '\u{1F916}'];
    const container = document.getElementById('emojiRain');

    function spawnDrop() {
        const drop = document.createElement('div');
        drop.className = 'emoji-drop';
        drop.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        drop.style.left = Math.random() * 100 + '%';
        drop.style.animationDuration = (5 + Math.random() * 8) + 's';
        container.appendChild(drop);
        setTimeout(() => drop.remove(), 13000);
    }

    function startRain() {
        if (!emojiInterval) {
            emojiInterval = setInterval(spawnDrop, 800);
        }
    }

    function stopRain() {
        if (emojiInterval) {
            clearInterval(emojiInterval);
            emojiInterval = null;
        }
    }

    // Pause when tab is hidden
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopRain();
        } else {
            startRain();
        }
    });

    startRain();
}

// --- Keyboard support for reopen link ---
document.addEventListener('keydown', (e) => {
    if (e.target.classList.contains('reopen-link') && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        heropenen();
    }
});

// --- Start! ---
nieuwSnippet();
startEmojiRain();
</script>

</body>
</html>
