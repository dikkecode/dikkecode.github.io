<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dikkecode — Elke keer weer anders</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --accent: #e94560;
            --accent2: #0f3460;
            --text: #eaeaea;
            --muted: #888;
            --code-bg: #16213e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 1rem;
            position: relative;
        }

        .logo {
            font-family: 'Fira Code', monospace;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent), #ff6b6b, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
        }

        .logo::after {
            content: '_';
            animation: blink 1s step-end infinite;
            -webkit-text-fill-color: var(--accent);
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .subtitle {
            color: var(--muted);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .emoji-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .emoji-drop {
            position: absolute;
            top: -50px;
            font-size: 1.5rem;
            animation: fall linear forwards;
            opacity: 0.15;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        main {
            max-width: 750px;
            width: 100%;
            padding: 1rem;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .code-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.1);
            margin-top: 1.5rem;
            border: 1px solid rgba(233, 69, 96, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .code-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(233, 69, 96, 0.2);
        }

        .card-header {
            background: var(--accent2);
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; border: none; padding: 0; }
        .dot-red { background: #ff5f56; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .dot-red:hover { transform: scale(1.3); box-shadow: 0 0 8px rgba(255, 95, 86, 0.6); }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .closed-message {
            display: none;
            text-align: center;
            padding: 3rem 2rem;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid rgba(233, 69, 96, 0.15);
            margin-top: 1.5rem;
            animation: fadeIn 0.5s ease forwards;
        }

        .closed-message .beer {
            font-size: 5rem;
            display: block;
            margin-bottom: 1rem;
            animation: beerWobble 1s ease-in-out infinite alternate;
        }

        @keyframes beerWobble {
            from { transform: rotate(-5deg); }
            to { transform: rotate(5deg); }
        }

        .closed-message h2 {
            font-family: 'Fira Code', monospace;
            font-size: 2rem;
            background: linear-gradient(135deg, #ffa502, #ffbd2e, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .closed-message p {
            color: var(--muted);
            font-size: 1rem;
        }

        .card-header .filename {
            margin-left: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .code-body {
            padding: 1.5rem;
            background: var(--code-bg);
        }

        pre {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            overflow-x: auto;
            white-space: pre;
            tab-size: 2;
        }

        .comment { color: #6a9955; }
        .keyword { color: #c586c0; }
        .string { color: #ce9178; }
        .function { color: #dcdcaa; }
        .number { color: #b5cea8; }
        .type { color: #4ec9b0; }
        .variable { color: #9cdcfe; }
        .operator { color: #d4d4d4; }
        .bracket { color: #ffd700; }

        .explanation {
            padding: 1.2rem 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ccc;
        }

        .explanation strong {
            color: var(--accent);
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #ff6b6b);
            color: white;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            background: var(--accent2);
        }

        .counter {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--muted);
            font-size: 0.85rem;
            font-family: 'Fira Code', monospace;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--muted);
            font-size: 0.8rem;
            position: relative;
            z-index: 1;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .logo { font-size: 2rem; }
            pre { font-size: 0.75rem; }
            .btn { padding: 0.6rem 1.2rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="emoji-rain" id="emojiRain"></div>

<header>
    <div class="logo">dikkecode</div>
    <p class="subtitle">Elke refresh een nieuw stukje code. Sommige nuttig. De meeste niet.</p>
</header>

<main>
    <div class="code-card fade-in" id="codeCard">
        <div class="card-header">
            <button class="dot dot-red" onclick="sluitWindow()" title="Sluiten"></button>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
            <span class="filename" id="filename">laden...</span>
        </div>
        <div class="code-body">
            <pre id="codeBlock">Laden...</pre>
        </div>
        <div class="explanation" id="explanation"></div>
    </div>

    <div class="closed-message" id="closedMessage">
        <span class="beer">&#x1F37A;</span>
        <h2>Tijd voor bier!</h2>
        <p>De code is gesloten. Je hebt genoeg gedaan voor vandaag.</p>
    </div>

    <div class="btn-row" id="btnRow">
        <button class="btn btn-primary" onclick="nieuwSnippet()">&#x1F504; Volgende code</button>
        <button class="btn btn-secondary" onclick="kopieerCode()">&#x1F4CB; Kopieer</button>
    </div>

    <div class="counter" id="counter"></div>
</main>

<footer>
    Gebouwd met &#x2764;&#xFE0F; en twijfelachtige programmeervaardigheden &mdash;
    <a href="https://github.com/dikkecode" target="_blank">GitHub</a>
</footer>

let huidigeIndex = -1;
let gezien = 0;

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

let volgorde = shuffleArray([...Array(snippets.length).keys()]);

function nieuwSnippet() {
    huidigeIndex = (huidigeIndex + 1) % snippets.length;
    if (huidigeIndex === 0 && gezien > 0) {
        volgorde = shuffleArray([...Array(snippets.length).keys()]);
    }

    const s = snippets[volgorde[huidigeIndex]];
    const card = document.getElementById('codeCard');
    card.classList.remove('fade-in');
    void card.offsetWidth;
    card.classList.add('fade-in');

    document.getElementById('filename').textContent = s.filename;
    document.getElementById('codeBlock').innerHTML = s.code;
    document.getElementById('explanation').innerHTML = s.uitleg;

    gezien++;
    document.getElementById('counter').textContent =
        `${gezien} snippet${gezien === 1 ? '' : 's'} bekeken — ${snippets.length - (huidigeIndex + 1)} te gaan in deze ronde`;
}

function sluitWindow() {
    const card = document.getElementById('codeCard');
    const msg = document.getElementById('closedMessage');
    const btnRow = document.getElementById('btnRow');
    const counter = document.getElementById('counter');

    card.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
    card.style.transform = 'scale(0.95)';
    card.style.opacity = '0';

    setTimeout(() => {
        card.style.display = 'none';
        btnRow.style.display = 'none';
        counter.style.display = 'none';
        msg.style.display = 'block';
    }, 400);
}

function kopieerCode() {
    const code = document.getElementById('codeBlock').innerText;
    navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.btn-secondary');
        const orig = btn.innerHTML;
        btn.innerHTML = '&#x2705; Gekopieerd!';
        setTimeout(() => btn.innerHTML = orig, 1500);
    });
}

// Emoji regen
function startEmojiRain() {
    const emojis = ['💻', '🐛', '☕', '🔥', '😅', '🚀', '⌨️', '🎉', '💾', '🤖'];
    const container = document.getElementById('emojiRain');

    setInterval(() => {
        const drop = document.createElement('div');
        drop.className = 'emoji-drop';
        drop.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        drop.style.left = Math.random() * 100 + '%';
        drop.style.animationDuration = (5 + Math.random() * 8) + 's';
        container.appendChild(drop);
        setTimeout(() => drop.remove(), 13000);
    }, 800);
}

// Start!
nieuwSnippet();
startEmojiRain();
